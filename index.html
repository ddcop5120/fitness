<style>
:root{--bg:#f2f4fa;--sf:#fff;--fg:#141a2b;--mu:#586079;--ln:#d9deea;--ac:#2450e6;--acf:#fff;--soft:#e6ecff;--hi:#c81e66;--ok:#12824a;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1220;--sf:#171c2e;--fg:#e9ecf7;--mu:#9aa3bd;--ln:#2a3148;--ac:#8aa6ff;--acf:#0b1330;--soft:#1f2a52;--hi:#ff7fb2;--ok:#4ade80;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e1220;--sf:#171c2e;--fg:#e9ecf7;--mu:#9aa3bd;--ln:#2a3148;--ac:#8aa6ff;--acf:#0b1330;--soft:#1f2a52;--hi:#ff7fb2;--ok:#4ade80;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
 padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:26px;line-height:1.25;margin:4px 0 0}
h2{font-size:19px;margin:0}
h3{font-size:16px;margin:0}
p{margin:0}
.mu{color:var(--mu)}.sm{font-size:13px}
.eb{font-size:12px;letter-spacing:.1em;color:var(--hi);font-weight:700}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bt{justify-content:space-between;flex-wrap:nowrap}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px 12px}
button.pri{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:700}
button.x{border:0;background:transparent;color:var(--mu);font-size:20px;padding:2px 8px;line-height:1}
select,input[type=text],input[type=date],input[type=search],textarea,.set input:not([type=checkbox]){background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:64px;resize:vertical}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
a{color:var(--ac)}
.nav input{flex:1}
.set{display:grid;grid-template-columns:22px 1fr 1fr auto auto;gap:6px;align-items:center}
.set .n{color:var(--mu);font-variant-numeric:tabular-nums;text-align:center}
.set input:not([type=checkbox]){width:100%}
.chk{display:flex;align-items:center;gap:4px;font-size:14px;white-space:nowrap}
.chk input{width:20px;height:20px;accent-color:var(--ok)}
.sets{display:flex;flex-direction:column;gap:6px}
ol.exs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:e}
ol.exs li{counter-increment:e;border-top:1px solid var(--ln);padding-top:10px}
.exn{font-weight:700}.exn::before{content:counter(e) ". ";color:var(--mu)}
.dose{color:var(--hi);font-weight:700;font-variant-numeric:tabular-nums}
details{border:1px dashed var(--ln);border-radius:10px;padding:8px 12px}
details.plain{border:0;padding:0}
summary{cursor:pointer;font-weight:700}
details ul,details ol{margin:6px 0 0;padding-left:22px}
.help details{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px}
.help li{margin:4px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border-radius:999px;min-width:44px}
.chips button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips.ball button[aria-pressed=true]{background:var(--ac);color:var(--acf);border-color:var(--ac)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mu);flex:1;min-width:130px}
label.f select{color:var(--fg)}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:1px 8px;background:var(--soft);color:var(--ac);font-weight:700}
.tag.rest{background:var(--bg);color:var(--mu)}
.stat{flex:1;min-width:90px}.stat b{display:block;font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:center;
 padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs button{flex:1;max-width:160px;border:0;background:transparent;padding:6px 4px;color:var(--mu);font-weight:700;border-radius:10px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;gap:10px}.top svg{width:42px;height:42px;flex:none}.top b{font-size:20px;line-height:1.2;display:block}.top span{font-size:12px;color:var(--mu)}.top button{margin-left:auto;font-size:13px;white-space:nowrap}
label.f input{color:var(--fg)}
nav.tabs button[aria-current=page]{color:var(--ac);background:var(--soft)}
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);
 border-radius:999px;padding:8px 8px 8px 18px;display:flex;gap:10px;align-items:center;font-weight:700;font-variant-numeric:tabular-nums;z-index:6;white-space:nowrap}
#timer button{border:0;background:transparent;color:inherit;font-size:18px;padding:2px 10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:16px;background:var(--fg);color:var(--bg);border-radius:10px;padding:8px 16px;z-index:7;max-width:90vw}
.fig{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.fig svg{width:190px;max-width:100%;height:auto;display:block}
.fig img{max-width:100%;width:240px;border-radius:10px;border:1px solid var(--ln)}
.mb{fill:var(--ln)}.m1{fill:var(--ac)}.m2{fill:var(--ac);opacity:.38}.mt{fill:var(--mu);font-size:9px}
.form label.f input,.form label.f textarea{color:var(--fg)}
</style>
</head>
<body>

  <button data-a="tab" data-v="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg>計畫</button>
  <button data-a="tab" data-v="hist"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>紀錄</button>
  <button data-a="tab" data-v="lib"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18M7 7v10M17 7v10M3 10v4M21 10v4"/></svg>動作庫</button>
  <button data-a="tab" data-v="help"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg>說明</button>
</nav>

<script>
/* ---------- 動作資料：n 名稱 g 分類 e 器材等級(gym/db/bw) eq 器材 p 主要肌群 s 協同肌群 k 類型 c 做法 r 次數覆寫 side 單邊 ---------- */
const EX={
squat:{n:'槓鈴深蹲',g:'下肢',e:'gym',eq:'槓鈴、深蹲架',p:'股四頭、臀',s:'核心、下背',k:'main',c:'槓放在上斜方，腳與肩同寬、腳尖微外開。吸氣撐住核心，臀往後下坐到大腿約與地面平行，膝蓋對準腳尖，全腳掌踩穩站起。請把安全槓調到蹲到底時略低於槓的位置。'},
goblet:{n:'高腳杯深蹲',g:'下肢',e:'db',eq:'啞鈴或壺鈴',p:'股四頭、臀',s:'核心',k:'main',c:'雙手把啞鈴直立抱在胸前、手肘朝下。軀幹挺直往下蹲，手肘落在膝蓋內側，再踩地站起。'},
bwsquat:{n:'徒手深蹲',g:'下肢',e:'bw',eq:'無',p:'股四頭、臀',s:'核心',k:'main',r:'15–20 下',c:'放慢節奏：3 秒下蹲、底部停 1 秒、再站起。膝蓋對準腳尖，腳跟不離地。'},
bss:{n:'保加利亞分腿蹲',g:'下肢',e:'bw',eq:'椅子或臥推椅（可手持啞鈴）',p:'股四頭、臀',s:'腿後、核心（平衡）',k:'acc',side:1,c:'後腳腳背放在椅上，前腳往前一大步。垂直往下蹲到前大腿約平行地面，前膝對準腳尖，用前腳發力站起。'},
legpress:{n:'腿推機',g:'下肢',e:'gym',eq:'腿推機',p:'股四頭、臀',s:'腿後',k:'acc',c:'背與臀貼緊椅墊，腳與肩同寬踩在踏板中間。鬆開保險後慢慢放到膝蓋約 90 度，推起時膝蓋不要完全鎖死，做完記得把保險扣回。'},
lunge:{n:'弓箭步',g:'下肢',e:'bw',eq:'無（可手持啞鈴）',p:'股四頭、臀',s:'腿後、核心',k:'acc',side:1,c:'往前跨一大步，兩膝各彎到約 90 度，後膝接近地面但不碰地。軀幹挺直，用前腳推回起始位置。'},
rdl:{n:'羅馬尼亞硬舉',g:'下肢',e:'gym',eq:'槓鈴',p:'腿後、臀',s:'下背、握力',k:'main',c:'膝蓋微彎後固定，臀往後推，槓貼著大腿滑到小腿中段。背全程打直，感覺腿後拉緊後夾臀站直。'},
dbrdl:{n:'啞鈴羅馬尼亞硬舉',g:'下肢',e:'db',eq:'啞鈴',p:'腿後、臀',s:'下背、握力',k:'main',c:'雙手持啞鈴放在大腿前。膝微彎固定，臀往後推讓啞鈴沿腿下滑到小腿中段，背打直，再夾臀站直。'},
bridge:{n:'單腳臀橋',g:'下肢',e:'bw',eq:'無',p:'臀、腿後',s:'核心',k:'acc',side:1,r:'12–15 下',c:'仰臥屈膝，一腳踩地、另一腳抬起。用踩地腳的腳跟發力把臀推高到肩、髖、膝成一直線，頂端停 1 秒。'},
legcurl:{n:'腿後勾機',g:'下肢',e:'gym',eq:'腿後勾機',p:'腿後',s:'小腿',k:'acc',c:'把滾墊調到腳踝上方，膝蓋對齊機器轉軸。勾到底停 1 秒，用 2–3 秒慢慢放回。'},
slidecurl:{n:'毛巾滑行腿後勾',g:'下肢',e:'bw',eq:'毛巾與光滑地板',p:'腿後',s:'臀、核心',k:'acc',r:'8–12 下',c:'仰臥、腳跟踩在毛巾上，先把臀抬起，再把腳跟滑向臀部後慢慢伸直，臀部全程不落地。'},
calf:{n:'站姿提踵',g:'下肢',e:'bw',eq:'階梯（可手持啞鈴）',p:'小腿',s:'足底',k:'iso',c:'前腳掌踩在階梯邊緣，腳跟下沉到底，再踮到最高點停 1 秒。'},
boxjump:{n:'跳箱',g:'爆發',e:'gym',eq:'跳箱',p:'臀腿爆發力',s:'小腿、核心',k:'power',c:'擺臂下蹲後全力起跳，輕聲落在箱上、膝微彎對準腳尖。走下來不要跳下來，每一下重新站好再跳。'},
cmj:{n:'原地垂直跳',g:'爆發',e:'bw',eq:'無',p:'臀腿爆發力',s:'小腿、核心',k:'power',c:'快速下蹲擺臂後全力往上跳。落地時前腳掌先著地、屈髖屈膝吸收衝擊，膝蓋不內夾。每下之間停 2–3 秒。'},
broad:{n:'立定跳遠',g:'爆發',e:'bw',eq:'無',p:'臀、腿後爆發力',s:'股四頭、核心',k:'power',c:'擺臂、臀往後坐，再全力往前跳。雙腳同時落地並停穩 2 秒，走回原點再跳。'},
bound:{n:'側向跳（滑冰跳）',g:'爆發',e:'bw',eq:'無',p:'臀中肌、腿部橫向爆發',s:'踝、核心',k:'power',side:1,c:'單腳往側邊跳，另一腳落地後停穩 1 秒再跳回。練橫移與單腳落地的穩定度。'},
mbslam:{n:'藥球過頭砸地',g:'爆發',e:'gym',eq:'藥球（不反彈的款式）',p:'背闊、核心',s:'肩、三頭',k:'power',r:'6–8 下',c:'雙手舉球過頭、身體伸展，再用全身力量往腳前地面砸。動作接近扣球的揮臂發力。'},
bench:{n:'槓鈴臥推',g:'胸',e:'gym',eq:'槓鈴、臥推椅',p:'胸',s:'三頭、前三角',k:'main',c:'肩胛後收下壓貼緊椅面，雙腳踩穩。槓下放到胸線下緣，手肘與身體約 45–60 度，再推回肩膀正上方。重量大時請找人保護或使用安全槓。'},
dbbench:{n:'啞鈴臥推',g:'胸',e:'db',eq:'啞鈴、臥推椅（或躺地板）',p:'胸',s:'三頭、前三角',k:'main',c:'肩胛後收，啞鈴在胸兩側。往上推到手臂伸直但不互撞，下放到上臂約與身體同高。'},
pushup:{n:'伏地挺身',g:'胸',e:'bw',eq:'無',p:'胸',s:'三頭、前三角、核心',k:'main',c:'手略寬於肩，身體從頭到腳跟成一直線。胸口下降到離地一個拳頭，手肘約 45 度，再推起。太難可改膝蓋著地。'},
incline:{n:'上斜啞鈴臥推',g:'胸',e:'db',eq:'啞鈴、可調式椅',p:'上胸',s:'前三角、三頭',k:'acc',c:'椅背調到約 30 度。啞鈴從上胸兩側往上推，下放時控制 2 秒。'},
declinepu:{n:'腳墊高伏地挺身',g:'胸',e:'bw',eq:'椅子',p:'上胸',s:'前三角、三頭',k:'acc',r:'8–15 下',c:'雙腳放在椅上、手撐地。身體保持一直線，胸口朝雙手之間下降再推起。'},
ohp:{n:'啞鈴肩推',g:'肩',e:'db',eq:'啞鈴（可坐可站）',p:'前、中三角',s:'三頭、上斜方',k:'main',c:'啞鈴在肩膀兩側、前臂垂直地面。收緊核心往頭頂推，不要挺腰借力，再慢慢放回耳朵高度。'},
pike:{n:'派克伏地挺身',g:'肩',e:'bw',eq:'無',p:'前、中三角',s:'三頭',k:'main',r:'6–12 下',c:'雙手雙腳撐地、臀部抬高成倒 V。彎手肘讓頭頂朝雙手前方下降，再推回。'},
latraise:{n:'啞鈴側平舉',g:'肩',e:'db',eq:'啞鈴',p:'中三角',s:'上斜方',k:'iso',c:'手肘微彎，把啞鈴往身體兩側抬到與肩同高，像倒水一樣小指略高。不要聳肩，慢慢放下。'},
facepull:{n:'滑輪臉拉',g:'肩',e:'gym',eq:'滑輪機、繩索把手',p:'後三角、肩胛肌群',s:'肩外旋肌',k:'acc',r:'12–15 下',c:'滑輪調到臉的高度。把繩索拉向額頭，手肘高於手腕並往外打開，停 1 秒後慢慢放回。'},
revfly:{n:'啞鈴俯身反向飛鳥',g:'肩',e:'db',eq:'輕啞鈴',p:'後三角',s:'菱形肌、中斜方',k:'acc',r:'12–15 下',c:'屈髖讓上身接近平行地面、背打直。手肘微彎把啞鈴往兩側打開到與肩同高，夾肩胛後慢放。'},
ytw:{n:'俯臥 Y-T-W',g:'肩',e:'bw',eq:'無',p:'後三角、下斜方',s:'肩外旋肌',k:'acc',r:'每個字母 8 下',c:'趴在地上，雙手依序擺成 Y、T、W 的形狀往上抬離地，每下停 1 秒，肩胛往下往後收。'},

/* ---------- 課表產生 ---------- */
const okEq=ex=>st.set.env==='gym'||(ex.e!=='gym'&&(st.set.env==='db'||ex.e==='bw'));
function dose(ty,ex){
  const sty=plOf(st.set.goal).st,lv=+st.set.lv;let d;
  if(ty==='power')d={sets:3,reps:'5 下',rest:120};
  else if(ty==='main')d=sty==='sport'?{sets:4,reps:'5–6 下',rest:150}:sty==='mass'?{sets:4,reps:'8–10 下',rest:120}:sty==='gen'?{sets:3,reps:'8–10 下',rest:90}:{sets:3,reps:'12 下',rest:60};
  else if(ty==='acc')d=sty==='fat'?{sets:3,reps:'12–15 下',rest:60}:{sets:3,reps:'8–12 下',rest:90};
  else if(ty==='iso')d={sets:3,reps:'12–15 下',rest:60};
  else if(ty==='pre')d={sets:2,reps:'12–15 下',rest:30};
  else if(ty==='core')d={sets:3,reps:'10–12 下',rest:30};
  else d={sets:6,reps:'30 秒',rest:60};
  if(ex.e==='bw'&&(ty==='main'||ty==='acc')&&!ex.r){d.reps='10–15 下';d.rest=90}
  if(ex.r)d.reps=ex.r;
  if(ex.side&&!/每邊/.test(d.reps))d.reps+='（每邊）';
  if(lv===0&&d.sets>2&&ty!=='cond')d.sets--;
  if(lv===2&&(ty==='main'||ty==='acc'))d.sets++;
  if(ex.sets)d.sets=ex.sets;
  if(ex.rest)d.rest=ex.rest;
  return d;
}
/* 時間估算：暖身 10 + 收操 8 分鐘，每組約 40 秒加休息，換項目 1 分鐘 */
const estRaw=items=>18+items.reduce((a,it)=>a+it.sets*((it.ty==='cond'?30:40)+it.rest)/60+1,0);
const est=items=>Math.max(5,Math.round(estRaw(items)/5)*5);
function fit(items,B,noGrow){
  const over=()=>estRaw(items)>B,
  cut=(ts,m)=>{for(const it of items){if(!over())return;if(ts.includes(it.ty)&&it.sets>m)it.sets=m}},
  drop=ts=>{for(let i=items.length-1;i>=0;i--){if(!over()||items.length<=2)return;if(ts.includes(items[i].ty))items.splice(i,1)}};
  cut(['pre','iso','core','acc'],2);drop(['pre','iso']);cut(['main','power','cond'],3);drop(['core','acc']);cut(['main','power','cond'],2);
  while(over()&&items.length>2)items.pop();
  if(!noGrow)for(const t of ['main','acc'])for(const it of items)if(it.ty===t&&it.sets<6){it.sets++;if(over()){it.sets--;return}}
}
function build(k,noFit){
  const S=SES[k],items=[];
  for(const sl of S.slots){
    const [name,ov]=sl.split(':'),id=Object.keys(st.custom).filter(x=>st.custom[x].slot===name).concat(SLOT[name]).find(x=>okEq(EX[x]));
    if(!id)continue;
    const ex=EX[id],ty=ov||ex.k;
    if(ty==='power'&&!plOf(st.set.goal).pw)continue;
    items.push(Object.assign({id,ty},dose(ty,ex)));
  }
  const B=noFit?0:parseInt(st.set.mins)||0;if(B)fit(items,B);
  const pw=plOf(st.set.goal).pw;
  return {k,t:!pw&&S.t2?S.t2:S.t,note:!pw&&S.cut?S.note.replace(/^[^。]*。/,''):S.note,items,min:est(items),tight:B&&estRaw(items)>B+2?1:0};
}
const perms=a=>a.length<2?[a]:a.flatMap((x,i)=>perms(a.filter((_,j)=>j!==i)).map(p=>[x,...p]));
function gen(){
  const s=st.set,days=[...s.days].sort((a,b)=>a-b),n=days.length;
  if(n<2||n>5){toast('請選 2 到 5 個訓練日');return}
  const keys=plOf(s.goal).plans[n],ball=isSport(s.goal)?s.ball:[];
  let best=null,bc=1e9;
  for(const p of perms(keys.map((_,i)=>i))){
    let c=0;
    p.forEach((k,i)=>{
      const A=SES[keys[k]],d=days[i],j=(i+1)%n;
      if((days[j]-d+7)%7===1){const B=SES[keys[p[j]]];c+=3*A.m.filter(x=>B.m.includes(x)).length}
      if(A.m.includes('腿')){if(ball.includes((d+1)%7))c+=2;if(ball.includes(d))c+=1}
    });
    if(c<bc){bc=c;best=p}
  }
  st.plan={goal:s.goal,lv:s.lv,env:s.env,ball:ball.slice(),days:{}};
  best.forEach((k,i)=>{st.plan.days[days[i]]=build(keys[k])});
  save();render();toast('已產生一週課表');
}

function regs(t){t=t||'';return /全身/.test(t)?Object.keys(SHP):MRE.filter(m=>m[1].test(t)).map(m=>m[0])}
const rc=(a,c)=>a.map(s=>`<rect class="${c}" x="${s[0]}" y="${s[1]}" width="${s[2]}" height="${s[3]}" rx="${s[4]}"/>`).join('');

function vPlan(){

  <div class="row"><label class="f">目標<select id="set-goal">${opts(Object.fromEntries(Object.keys(GOALS).concat(Object.keys(st.goals)).map(k=>[k,goalOf(k).n+(GOALS[k]?'':'（自訂）')])),s.goal)}</select></label><label class="f">程度<select id="set-lv">${opts(LEVELS,s.lv)}</select></label></div>
  <details class="plain sm"><summary>找不到你的運動？新增自訂目標</summary><div class="row" style="margin-top:8px"><input type="text" id="g-n" maxlength="20" placeholder="運動名稱，例如：網球" style="flex:1" aria-label="自訂運動名稱"><select id="g-pl" aria-label="訓練類型">${Object.keys(PL).map(k=>`<option value="${k}">${PL[k].l}</option>`).join('')}</select><button data-a="addgoal">新增</button></div></details>
  ${st.goals[s.goal]?'<div class="row"><button data-a="delgoal" class="sm">刪除自訂目標「'+esc(goalOf(s.goal).n)+'」</button></div>':''}

  <div><div class="row bt"><span class="mu sm">重量訓練日（選 2–5 天，目前 ${s.days.length} 天）</span><button data-a="suggest" class="sm">套用建議</button></div>${chips('',s.days,'tgday')}</div>
  ${sp?`<div><span class="mu sm">專項練習日，例如打球、下水的日子（排課時會避免前一天練重腿）</span>${chips('ball',s.ball,'tgball')}</div>`:''}
  <p class="mu sm">建議頻率：初學每週 3 次、中階 4 次、進階 5 次；比賽期或打球天數多時減 1 次。</p>
  <button class="pri" data-a="gen">${st.plan?'重新產生課表':'產生一週課表'}</button></section>`;

    const tw=wd(today());
    h+=`<p class="mu sm">目前課表：${esc(goalOf(st.plan.goal).n)}・${LEVELS[st.plan.lv].split('（')[0]}・${ENVS[st.plan.env].split('（')[0]}。重量以「做完還有 1–2 下餘力」為準，連續兩次都能做滿建議次數上限再加重。${goalOf(st.plan.goal).tip?'<br>'+goalOf(st.plan.goal).tip:''}</p>`;

function vHist(){
  const ds=Object.keys(st.logs).sort().reverse();
  const t=new Date(),mon=new Date(t.getFullYear(),t.getMonth(),t.getDate()-(t.getDay()+6)%7),m0=fmt(mon);
  const wk=ds.filter(d=>d>=m0&&d<=today()).length,mo=ds.filter(d=>d.slice(0,7)===today().slice(0,7)).length;
  let h=`<h1>歷史紀錄</h1><section class="card"><div class="row"><div class="stat"><b>${wk}</b><span class="mu sm">本週訓練天數</span></div><div class="stat"><b>${mo}</b><span class="mu sm">本月</span></div><div class="stat"><b>${ds.length}</b><span class="mu sm">累計</span></div></div></section>`;
  h+=ds.length?ds.map(d=>{const l=st.logs[d];return `<section class="card"><div class="row bt"><div><b>${nice(d)}</b>${l.title?'　<span class="tag">'+esc(l.title)+'</span>':''}</div><span class="mu sm">${d.slice(0,4)}</span></div>
    <div class="sm">${l.items.map(it=>{const a=it.sets.filter(s=>s.r||s.d).map(s=>(s.w?s.w+(it.u||'kg')+'×':'')+(s.r||'✓'));return '<div><b>'+esc(it.name)+'</b>'+(a.length?'：'+esc(a.join('、')):'')+'</div>'}).join('')}${l.note?'<div class="mu">備註：'+esc(l.note)+'</div>':''}</div>
    <div class="row"><button data-a="open" data-v="${d}">查看／編輯</button><button data-a="del" data-v="${d}">${delAsk===d?'再按一次確定刪除':'刪除'}</button></div></section>`}).join('')
   :`<p class="mu">還沒有任何紀錄。到「今日」記下第一次訓練，這裡就會出現。</p>`;
  h+=`<section class="card"><h3>備份與轉移</h3><p class="mu sm">紀錄存在這台裝置的這個瀏覽器裡。換手機、換瀏覽器或清除瀏覽資料前，請先匯出備份檔。</p>

  return h;
}

function readImg(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();
  im.onload=()=>{const m=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*m);c.height=Math.round(im.height*m);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};
  im.onerror=()=>toast('無法讀取這張圖片');im.src=r.result};r.readAsDataURL(file)}

  ${sec('快速開始：三步驟',`<ol><li>到「計畫」選目標、程度、器材，點選一週要訓練的日子，按「產生一週課表」。</li><li>訓練當天到「今日」，按「開始訓練」，課表的項目就會變成可填寫的紀錄，上方的當日課表會自動收合。</li><li>每做完一組，填重量與次數並勾「完成」，休息倒數會自動開始。</li></ol><p class="mu sm">不排課表也可以用：直接在「今日」最下面的「新增項目」加入當天做的動作。</p>`,1)}
  ${sec('計畫：產生一週課表',`<ul><li><b>目標</b>：選你的運動或訓練目的，會決定動作、組數、次數與休息時間。</li><li><b>程度</b>：初學組數較少，進階較多。</li><li><b>器材</b>：選「居家啞鈴」或「徒手」時，只會排你做得到的動作。</li><li><b>每次可用時間</b>：填分鐘數，課表會依時間增減；留空則用系統建議的長度。</li><li><b>重量訓練日</b>：點選星期，可選 2 到 5 天。不確定就按「套用建議」。</li><li><b>專項練習日</b>：點選打球或下水的日子，排課時會避免前一天練重腿。</li><li>每堂課包含暖身、動作清單、收操與預估時間。點「怎麼做・示意圖」可看做法、肌群圖與教學連結。</li><li>改了任何設定後，要再按一次「重新產生課表」才會套用。</li></ul>`)}
  ${sec('計畫：新增自己的運動目標',`<ul><li>在目標下方點「找不到你的運動？新增自訂目標」。</li><li>輸入運動名稱，再選最接近的訓練類型，例如網球選「橫移揮拍型」。</li><li>新增後會自動選取，按「產生一週課表」即可。選到自訂目標時，下方會出現刪除按鈕。</li></ul>`)}
  ${sec('今日：記錄訓練',`<ul><li>最上方可用箭頭或日期欄切換日期，補記前幾天的訓練。</li><li>每個項目的每一組都有重量、次數兩格和「完成」勾選，輸入後自動儲存。</li><li>「＋ 加一組」會複製上一組的重量與次數。組右邊的 × 是刪除那一組，項目右上角的 × 是移除整個項目。</li><li>項目名稱下方會顯示同一個動作上次的成績，方便決定這次的重量。</li><li>「新增項目」可從動作庫選，或自己輸入名稱，例如「排球練習 90 分鐘」。</li><li>最下面的「備註」可記當天狀況。</li></ul>`)}
  ${sec('今日：太累或時間不夠',`<ul><li><b>今天比較累：用輕量版開始</b>：動作不變，每項少一組。重量請降到平常的八成左右。已經開始訓練也可以中途按「改成輕量版」。</li><li><b>依時間精簡後開始</b>：在「今天只有幾分鐘？」填入分鐘數再按，會優先保留主要動作。只影響當天，不會改課表。</li><li>如果是關節痛、頭暈或生病，請直接休息。</li></ul>`)}
  ${sec('今日：換一份臨時課表、取消訓練',`<ul><li><b>另排一份臨時課表</b>：還沒開始訓練時，當日課表下方有這個選項。選想練的重點和要做幾個項目（2 到 8 個），系統會推薦對應數量的動作並直接開始。上面會列出原本課表的項目給你參考。</li><li>臨時課表只用在那一天，不會改掉一週課表；休息日也可以用。</li><li><b>取消這次訓練</b>：開始訓練後，「訓練紀錄」標題下方有這顆按鈕，按兩次會一次清空當天全部項目，不用一個個移除。備註會保留。</li><li>取消之後可以重新選一般版、輕量版、依時間精簡或臨時課表。</li><li>開始訓練後當日課表會收合，點課表標題可以再展開看暖身、做法與收操。</li></ul>`)}
  ${sec('今日：器材有人在用（換動作）',`<ul><li>在項目下方按「換動作」，會列出練到相同部位的替代動作。</li><li>標有「好上手」的比較容易學，適合不熟器材或狀況不好時選。</li><li>換動作只改當天的紀錄，不會改課表。</li></ul>`)}
  ${sec('今日：公斤／磅與休息計時',`<ul><li>項目下方的「公斤 kg ⇄」按一下會切換成磅，已填的重量會自動換算，再按一次換回來。每個項目可以用不同單位。</li><li>「組間休息」可選 30 到 150 秒。勾「完成」會自動開始倒數，也可以按「開始計時」手動開始。</li><li>倒數顯示在畫面下方，結束時手機會震動（需手機支援），按 × 可關閉。</li></ul>`)}
  ${sec('今日：常用紀錄',`<ul><li>填好某個項目的重量與次數後，按「存成常用」。</li><li>之後在「新增項目」最上面會看到它，點一下就把當時每一組的重量與次數帶進當天紀錄。</li><li>同一個動作再存一次會更新成最新的內容。右邊的 × 可刪除。</li></ul>`)}
  ${sec('紀錄：歷史與備份',`<ul><li>上方顯示本週、本月與累計的訓練天數。</li><li>每一天的紀錄可按「查看／編輯」回到那天修改，或按兩次「刪除」移除。</li><li><b>匯出備份檔</b>：把所有資料存成一個檔案。換手機、換瀏覽器或清除瀏覽資料前請先匯出。</li><li><b>匯入備份檔</b>：選擇之前匯出的檔案，會取代目前這台裝置上的資料。</li></ul>`)}
  ${sec('動作庫：查動作、加自己的動作與圖片',`<ul><li>可用上方搜尋欄找動作、部位或器材。點動作名稱展開，可看建議組數、肌群示意圖、做法與教學連結。</li><li>肌群示意圖中，深色是主要肌群，淺色是協同肌群。</li><li>「教學影片」與「動作圖解」會另開 YouTube 與 Google 圖片的搜尋結果。</li><li><b>加上我的圖片</b>：可放自己拍的器材或動作照片，之後在課表裡也看得到。</li><li><b>＋ 新增自訂動作</b>：填名稱並選「動作類型」。重新產生課表後，它會取代同類型的預設動作。不想排進課表就選「不排課」。</li></ul>`)}
  ${sec('資料存在哪裡、加到主畫面、外觀',`<ul><li>所有資料只存在你這台裝置的這個瀏覽器裡，不會上傳，別人也看不到。用不同瀏覽器或不同手機開啟，資料不會同步。</li><li>全螢幕使用：先加到主畫面，再從主畫面的圖示開啟，就不會有瀏覽器的網址列。iPhone 用 Safari 的分享鍵選「加入主畫面」；Android 用 Chrome 選單選「加到主畫面」或「安裝應用程式」。</li><li>右上角的「外觀」可切換自動、淺色、深色。自動會跟著手機的夜間模式。</li><li>課表是通用的訓練原則，沒有考慮個人傷病。有舊傷或不適請自行調整，必要時詢問專業人員。</li></ul>`)}
  </div>`;
}
function render(){
  $('#app').innerHTML=`<header class="top"><svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#2450e6"/><rect x="14" y="21.5" width="20" height="5" rx="2" fill="#fff"/><rect x="9" y="14" width="6" height="20" rx="3" fill="#fff"/><rect x="33" y="14" width="6" height="20" rx="3" fill="#fff"/><rect x="5" y="18" width="4" height="12" rx="2" fill="#ffd0e2"/><rect x="39" y="18" width="4" height="12" rx="2" fill="#ffd0e2"/><circle cx="38" cy="9" r="4" fill="#ff5c9a"/></svg><div><b>幫我練一下</b><span>排課表・記重量・看進步</span></div><button data-a="theme">${{'':'外觀：自動',light:'外觀：淺色',dark:'外觀：深色'}[st.theme||'']}</button></header>`+(tab==='today'?vToday():tab==='plan'?vPlan():tab==='hist'?vHist():tab==='help'?vHelp():vLib());
  document.querySelectorAll('nav.tabs button').forEach(b=>b.dataset.v===tab?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
}

/* ---------- 計時 ---------- */
function tick(){$('#timer').hidden=false;$('#timer-t').textContent=left>0?'休息中 '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0'):'休息結束，開始下一組'}
function startTimer(s){left=+s;clearInterval(tm);tick();tm=setInterval(()=>{left--;tick();if(left<=0){clearInterval(tm);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}},1000)}

/* ---------- 事件 ---------- */
function addItem(o){getLog().items.push(o);save();render()}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,v=b.dataset.v,i=+b.dataset.i,s=+b.dataset.s;
  if(a!=='del'&&a!=='delex'&&a!=='cancel')delAsk=null;
  if(a!=='swap'&&a!=='doswap')swapAt=null;
  if(a==='tab'){tab=v;render();window.scrollTo(0,0)}
  else if(a==='day'){const d=parse(cur);d.setDate(d.getDate()+ +v);cur=fmt(d);render()}
  else if(a==='load'){const p=st.plan.days[wd(cur)],items=JSON.parse(JSON.stringify(p.items.filter(it=>EX[it.id])));
    items.forEach(it=>it.ty=it.ty||EX[it.id].k);
    if(v==='fit'){const B=parseInt($('#today-mins').value)||0;if(B<15){toast('請輸入今天可用的分鐘數（至少 15）');$('#today-mins').focus();return}fit(items,B,1)}
    const l=getLog();l.title=p.t+(v==='fit'?'（精簡）':'');
    items.forEach(it=>l.items.push({id:it.id,name:EX[it.id].n,u:st.unit||'kg',rest:it.rest,dose:it.sets+' 組 × '+it.reps,sets:Array.from({length:it.sets},()=>({w:'',r:'',d:false}))}));
    if(v==='light')lighten(l);save();render();if(v==='fit')toast('已精簡，預估約 '+est(items)+' 分鐘')}
  else if(a==='cancel'){if(delAsk==='cancel'){const l=st.logs[cur];l.items=[];l.title='';l.light=false;clean();delAsk=null;save()}else delAsk='cancel';render()}
  else if(a==='adhoc'){const N=+$('#ah-n').value,b=build($('#ah-k').value,1),items=b.items;
    for(const t of ['pre','iso','core','acc','power','main'])for(let j=items.length-1;j>=0&&items.length>N;j--)if(items[j].ty===t)items.splice(j,1);
    for(let n=0;n<3&&items.length<N;n++)for(const it of items.slice()){if(items.length>=N)break;
      const x=alts(it.id).find(z=>!items.some(q=>q.id===z));if(x){const ex=EX[x],ty=ex.k==='main'?'acc':ex.k;items.push(Object.assign({id:x,ty},dose(ty,ex)))}}
    const l=getLog();l.title=b.t+'（臨時）';
    items.forEach(it=>l.items.push({id:it.id,name:EX[it.id].n,u:st.unit||'kg',rest:it.rest,dose:it.sets+' 組 × '+it.reps,sets:Array.from({length:it.sets},()=>({w:'',r:'',d:false}))}));
    save();render();toast('已排出 '+items.length+' 個項目，預估約 '+est(items)+' 分鐘')}
  else if(a==='unit'){const it=st.logs[cur].items[i],toLb=it.u!=='lb';it.u=toLb?'lb':'kg';st.unit=it.u;
    it.sets.forEach(x=>{const n=parseFloat(x.w);if(!isNaN(n))x.w=String(Math.round((toLb?n*2.20462:n/2.20462)*2)/2)});save();render()}
  else if(a==='fav'){const it=st.logs[cur].items[i],ss=it.sets.filter(x=>x.w||x.r).map(x=>({w:x.w,r:x.r}));
    if(!ss.length){toast('先填入重量或次數再儲存');return}
    st.favs=st.favs.filter(f=>f.name!==it.name);st.favs.unshift({id:it.id,name:it.name,u:it.u||'kg',rest:it.rest||90,sets:ss,date:cur});save();render();toast('已存成常用，可在「新增項目」快速取用')}
  else if(a==='usefav'){const f=st.favs[+v];addItem({id:f.id&&EX[f.id]?f.id:undefined,name:f.name,u:f.u,rest:f.rest,dose:f.sets.length+' 組（沿用常用紀錄）',sets:f.sets.map(x=>({w:x.w,r:x.r,d:false}))})}
  else if(a==='rmfav'){st.favs.splice(+v,1);save();render()}
  else if(a==='addgoal'){const n=$('#g-n').value.trim();if(!n){toast('請輸入運動名稱');return}const id='g'+Date.now().toString(36);st.goals[id]={n,pl:$('#g-pl').value};st.set.goal=id;save();render();toast('已新增，按「產生一週課表」套用')}
  else if(a==='delgoal'){const id=st.set.goal;delete st.goals[id];st.set.goal='vb';if(st.plan&&st.plan.goal===id)st.plan=null;save();render()}
  else if(a==='theme'){st.theme={'':'light',light:'dark',dark:''}[st.theme||''];sync();save();render()}
  else if(a==='lighten'){lighten(st.logs[cur]);save();render()}
  else if(a==='swap'){swapAt=swapAt===i?null:i;render()}
  else if(a==='doswap'){const it=st.logs[cur].items[i],ex=EX[v],d=dose(ex.k,ex);it.id=v;it.name=ex.n;it.rest=d.rest;it.dose=it.sets.length+' 組 × '+d.reps;swapAt=null;save();render()}
  else if(a==='addex'){const id=$('#add-ex').value,ex=EX[id],d=dose(ex.k,ex);addItem({id,name:ex.n,u:st.unit||'kg',rest:d.rest,dose:d.sets+' 組 × '+d.reps,sets:[{w:'',r:'',d:false}]})}
  else if(a==='addcustom'){const n=$('#add-name').value.trim();if(!n){$('#add-name').focus();return}addItem({name:n,u:st.unit||'kg',rest:90,sets:[{w:'',r:'',d:false}]})}
  else if(a==='addset'){const it=st.logs[cur].items[i],l=it.sets[it.sets.length-1]||{};it.sets.push({w:l.w||'',r:l.r||'',d:false});save();render()}
  else if(a==='rmset'){st.logs[cur].items[i].sets.splice(s,1);save();render()}
  else if(a==='rmitem'){st.logs[cur].items.splice(i,1);clean();save();render()}
  else if(a==='timer')startTimer(st.logs[cur].items[i].rest||90)
  else if(a==='stoptimer'){clearInterval(tm);$('#timer').hidden=true}
  else if(a==='tgday'||a==='tgball'){const arr=a==='tgday'?st.set.days:st.set.ball,x=+v,k=arr.indexOf(x);
    if(k>=0)arr.splice(k,1);else if(a==='tgday'&&arr.length>=5){toast('重量訓練最多排 5 天，留時間恢復');return}else arr.push(x);save();render()}
  else if(a==='suggest'){st.set.days=SUGGEST[+st.set.lv].slice();save();render()}
  else if(a==='gen')gen()
  else if(a==='open'){cur=v;tab='today';render();window.scrollTo(0,0)}
  else if(a==='del'){if(delAsk===v){delete st.logs[v];delAsk=null;save()}else delAsk=v;render()}
  else if(a==='export'){const x=document.createElement('a');x.href=URL.createObjectURL(new Blob([JSON.stringify(st,null,1)],{type:'application/json'}));x.download='幫我練一下備份-'+today()+'.json';document.body.appendChild(x);x.click();x.remove()}
  else if(a==='import')$('#imp').click()
  else if(a==='newex'){form={e:'gym'};render()}
  else if(a==='editex'){form=Object.assign({id:v},st.custom[v]);render();window.scrollTo(0,0)}
  else if(a==='cancelex'){form=null;render()}
  else if(a==='saveex'){
    const g=x=>$('#f-'+x).value.trim(),n=g('n'),sv=g('slot');
    if(!n){toast('請輸入動作名稱');$('#f-n').focus();return}
    const slot=sv.startsWith('none:')?'':sv,info=SLOTINFO[slot],url=g('url');
    if(url&&!/^https?:\/\//.test(url)){toast('網址要以 http:// 或 https:// 開頭');$('#f-url').focus();return}
    const id=form.id||'c'+Date.now().toString(36);
    st.custom[id]={custom:1,n,slot,g:info?info[1]:sv.slice(5),k:info?info[2]:'acc',e:g('e'),eq:g('eq')||'未填',p:g('p')||'未填',s:g('s')||'無',c:g('c'),url,
      sets:Math.min(10,Math.max(0,parseInt(g('sets'))||0)),r:g('r'),rest:Math.min(600,Math.max(0,parseInt(g('rest'))||0))};
    sync();form=null;openEx=id;save();render();toast(slot?'已儲存。重新產生課表後會排進去':'已儲存到動作庫')}
  else if(a==='delex'){openEx=v;
    if(delAsk==='ex:'+v){delete st.custom[v];delete st.imgs[v];delAsk=null;
      if(st.plan)for(const d in st.plan.days)st.plan.days[d].items=st.plan.days[d].items.filter(it=>it.id!==v);
      sync();save()}else delAsk='ex:'+v;
    render()}
  else if(a==='addimg'){imgFor=v;openEx=v;$('#img-in').value='';$('#img-in').click()}
  else if(a==='rmimg'){delete st.imgs[v];openEx=v;save();render()}
});
document.addEventListener('input',e=>{
  const t=e.target,f=t.dataset.f;
  if(f){const it=st.logs[cur].items[+t.dataset.i],s=it.sets[+t.dataset.s];
    if(f==='rest')it.rest=+t.value;else if(f==='d'){s.d=t.checked;if(s.d)startTimer(it.rest||90)}else s[f]=t.value;save()}
  else if(t.id==='note'){getLog().note=t.value;clean();save()}
  else if(t.id==='lib-q'){q=t.value;$('#lib-list').innerHTML=libList()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='cur-date'&&t.value){cur=t.value;render()}
  else if(t.id==='set-goal'){st.set.goal=t.value;save();render()}
  else if(t.id==='set-lv'){st.set.lv=+t.value;save();render()}
  else if(t.id==='set-mins'){st.set.mins=t.value.replace(/\D/g,'');save()}
  else if(t.id==='set-env'){st.set.env=t.value;save();render()}
  else if(t.id==='img-in'&&t.files[0]&&imgFor){const id=imgFor;readImg(t.files[0],u=>{st.imgs[id]=u;if(!save())delete st.imgs[id];render()})}
  else if(t.id==='imp'&&t.files[0]){const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d.logs!=='object'||!d.set)throw 0;st=d;sync();save();render();toast('已匯入備份')}catch(x){toast('這個檔案不是幫我練一下的備份檔')}};
    r.readAsText(t.files[0])}
});
render();
</script>
</body>
</html>
